buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '0.4.0'
group = 'io.github.thedoctorttv.fakecrash'
archivesBaseName = 'mc-crash-mod'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20190719-1.14.3'
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'info'
            mods { ped { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run/server')
            args 'nogui'
            property 'forge.logging.console.level', 'info'
            mods { ped { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.14.4-28.2.26'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
jar {
    manifest { attributes 'Implementation-Version': project.version }
}
jar.finalizedBy('reobfJar')
